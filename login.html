<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Login - Fretados Intelligence</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        padding: 50px;
      }
      .card {
        max-width: 400px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
      }
      .form-group input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      .btn {
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .msg-danger {
        color: red;
        list-style: none;
        padding: 0;
      }
      .msg-success {
        color: green;
        list-style: none;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Fretados Intelligence</h2>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %}
      <ul>
        {% for category, message in messages %}
        <li class="msg-{{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %} {% endwith %}

      <form method="POST">
        <div class="form-group">
          <label>Utilizador:</label>
          <input type="text" name="usuario" required />
        </div>

        <div class="form-group">
          <label>Senha:</label>
          <input type="password" name="senha" required />
        </div>

        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>
  </body>
</html>
